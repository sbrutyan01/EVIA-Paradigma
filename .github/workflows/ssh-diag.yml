name: ssh-diag

# Read-only: does this machine run a GitLab, and is this repository wired to it?
# Prints service names and local ports only - no tokens, no addresses beyond localhost.
# Temporary: delete once the GitLab question is settled.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Is a GitLab installed here
        run: |
          for c in gitlab-ctl gitlab-rake gitlab-runner glab; do
            printf '%-14s %s\n' "$c" "$(command -v $c || echo '-')"
          done
          echo "--- systemd units matching gitlab:"
          systemctl list-units --type=service --all --no-legend --no-pager 2>/dev/null \
            | awk '$1 ~ /gitlab/ {print $1, $3, $4}' || echo none
          echo "--- docker containers, if docker is usable:"
          docker ps --format '{{.Names}}  {{.Image}}  {{.Status}}' 2>/dev/null || echo "docker not usable from here"
          echo "--- local listening ports commonly used by a GitLab:"
          ss -ltn 2>/dev/null | awk 'NR==1 || $4 ~ /:(80|443|8080|8929|2222)$/' || echo "cannot read ports"

      - name: Does a clone here point at a GitLab
        run: |
          for d in "$HOME"/*/.git "$HOME"/*/*/.git; do
            [ -d "$d" ] || continue
            r=$(git -C "${d%/.git}" remote -v 2>/dev/null | awk '{print $2}' | sort -u | tr '\n' ' ')
            case "$r" in *gitlab*|*192.168*|*localhost*) echo "${d%/.git}: $r";; esac
          done
          echo "(only clones whose remotes mention gitlab or a local address are listed)"
