name: ssh-diag

# Read-only: is Tailscale up and logged in on this machine, and what is its address on the tailnet.
# Deliberately prints only the backend state and this node's own IPv4 - no device list, no tailnet
# name, no account - because the logs of a public repository are public.
# Temporary: delete once remote access is settled.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - name: Tailscale state
        run: |
          if ! command -v tailscale > /dev/null; then
            echo "tailscale is not installed on this machine"; exit 0
          fi
          echo "binary : $(command -v tailscale)"
          echo "version: $(tailscale version 2>&1 | head -1)"
          state=$(tailscale status --json 2>/dev/null | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("BackendState","?"))' 2>/dev/null || echo "?")
          echo "state  : $state"
          echo "this node's IPv4: $(tailscale ip -4 2>&1 | head -1)"
          case "$state" in
            Running) echo "-> logged in and connected" ;;
            NeedsLogin) echo "-> NOT logged in: 'sudo tailscale up' prints a URL that has to be opened" ;;
            Stopped) echo "-> installed and logged in, but switched off: 'sudo tailscale up'" ;;
            *) echo "-> state unclear; 'tailscale status' on the machine itself will say" ;;
          esac
          echo "--- is sshd listening (it is what you will connect to):"
          ss -ltn 2>/dev/null | grep -E ':22[[:space:]]' || echo "nothing on 22"
