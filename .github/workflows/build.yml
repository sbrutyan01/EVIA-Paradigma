name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CLANG_VERSION: "23"     # latest stable LLVM/Clang

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Install Clang ${{ env.CLANG_VERSION }}
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CLANG_VERSION"
          clang++-"$CLANG_VERSION" --version

      - name: Generate C++ from the examples, compile with Clang, compare with the interpreter
        run: scripts/check-examples.sh "clang++-$CLANG_VERSION"

      - name: Upload the application and generated C++
        uses: actions/upload-artifact@v4
        with:
          name: evia-paradigma
          path: |
            target/evia-paradigma-*.jar
            build/examples/*.cpp
