name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CLANG_VERSION: "23"     # latest stable LLVM/Clang

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Install Clang ${{ env.CLANG_VERSION }}
        run: |
          # apt.llvm.org is sometimes unreachable: retry, then fall back to Ubuntu's Clang
          for i in 1 2 3 4 5; do
            if wget -qO llvm.sh https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh "$CLANG_VERSION"; then
              echo "CXX=clang++-$CLANG_VERSION" >> "$GITHUB_ENV"
              break
            fi
            echo "apt.llvm.org attempt $i failed"; sleep 30
          done
          if ! grep -q '^CXX=' "$GITHUB_ENV"; then
            echo "::warning::apt.llvm.org unreachable - checking with Ubuntu's clang++ instead of Clang $CLANG_VERSION"
            sudo apt-get install -y clang
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Generate C++ from the examples, compile with Clang, compare with the interpreter
        run: |
          "$CXX" --version
          scripts/check-examples.sh "$CXX"

      - name: Classes, modules, View source code, projects and Git integration
        run: scripts/check-app.sh

      - name: "Every language and mode (C99..C++20 x structured/goto x safe/fast) with Clang"
        run: CC="${CXX/clang++/clang}" CXX="$CXX" scripts/check-targets.sh

      - name: "Every language and mode with GCC"
        run: CC=gcc CXX=g++ scripts/check-targets.sh

      - name: Upload the application and generated C++
        uses: actions/upload-artifact@v4
        with:
          name: evia-paradigma
          path: |
            target/evia-paradigma-*.jar
            build/examples/*.cpp

  # Windows without Visual Studio: Clang from llvm-mingw (its own libc++ and Windows headers),
  # the same toolchain EVIA Paradigma installs with "Install Clang...".
  windows-llvm-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Download the latest llvm-mingw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/mstorsjo/llvm-mingw/releases/latest \
                --jq '.assets[].browser_download_url | select(test("-ucrt-x86_64\\.zip$"))')
          echo "$url"
          curl -sSL -o llvm-mingw.zip "$url"
          7z x -y -o"$RUNNER_TEMP" llvm-mingw.zip > /dev/null
          bin=$(ls -d "$RUNNER_TEMP"/llvm-mingw-*/bin)
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/clang++" --version

      - name: Generate C++, compile with llvm-mingw Clang (-static), compare with the interpreter
        env:
          CXXFLAGS: -static
        run: scripts/check-examples.sh clang++

      - name: "C and C++ standards with llvm-mingw Clang (-static, no Visual Studio)"
        env:
          CXXFLAGS: -static
          LANGS: c99 c17 c++98 c++14 c++20
        run: CC=clang CXX=clang++ scripts/check-targets.sh

      - name: Check the programs need nothing from Visual Studio
        run: |
          for exe in build/examples/*.exe build/targets/*.exe; do
            dlls=$(llvm-objdump -p "$exe" | sed -n 's/.*DLL Name: //p' | tr '\n' ' ')
            echo "$(basename "$exe"): $dlls"
            if echo "$dlls" | grep -qiE 'vcruntime|msvcp|msvcr|concrt'; then
              echo "::error::$exe depends on the Visual Studio C++ runtime"; exit 1
            fi
          done
          clang++ -dumpmachine
          clang++ -dumpmachine | grep -q windows-gnu
