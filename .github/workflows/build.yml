name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CLANG_VERSION: "23"     # latest stable LLVM/Clang

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Install Clang ${{ env.CLANG_VERSION }}
        run: |
          # apt.llvm.org is sometimes unreachable: retry, then fall back to Ubuntu's Clang
          for i in 1 2 3 4 5; do
            if wget -qO llvm.sh https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh "$CLANG_VERSION"; then
              echo "CXX=clang++-$CLANG_VERSION" >> "$GITHUB_ENV"
              break
            fi
            echo "apt.llvm.org attempt $i failed"; sleep 30
          done
          if ! grep -q '^CXX=' "$GITHUB_ENV"; then
            echo "::warning::apt.llvm.org unreachable - checking with Ubuntu's clang++ instead of Clang $CLANG_VERSION"
            sudo apt-get install -y clang
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Generate C++ from the examples, compile with Clang, compare with the interpreter
        run: |
          "$CXX" --version
          scripts/check-examples.sh "$CXX"

      - name: Classes, modules, View source code, projects and Git integration
        run: scripts/check-app.sh

      - name: Zoom with the mouse wheel (real main window under Xvfb)
        run: |
          command -v xvfb-run > /dev/null || sudo apt-get install -y xvfb
          scripts/check-zoom.sh

      - name: "Every language and mode (C99..C++20 x structured/goto x safe/fast) with Clang"
        run: CC="${CXX/clang++/clang}" CXX="$CXX" scripts/check-targets.sh

      - name: "Every language and mode with GCC"
        run: CC=gcc CXX=g++ scripts/check-targets.sh

      - name: Upload the application and generated C++
        uses: actions/upload-artifact@v4
        with:
          name: evia-paradigma
          path: |
            target/evia-paradigma-*.jar
            build/examples/*.cpp

  # Microcontrollers: bare-metal AVR C with avr-gcc, run in simavr against the interpreter, and
  # Arduino sketches for 6 Arduino AVR boards and 6 ESP32 chips with arduino-cli.
  boards:
    runs-on: ubuntu-24.04
    env:
      AVR_GCC_URL: https://github.com/ZakKemble/avr-gcc-build/releases/download/v14.1.0-1/avr-gcc-14.1.0-x64-linux.tar.bz2
      SIMAVR_COMMIT: cb4aa607634469a6c1e1170fae30ece0672d4405
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: avr-gcc 14 and avr-libc
        run: |
          curl -sSL --retry 5 -o avr.tar.bz2 "$AVR_GCC_URL"
          tar xjf avr.tar.bz2 -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/avr-gcc-14.1.0-x64-linux/bin" >> "$GITHUB_PATH"

      - name: simavr (built as scripts/simavr/evia_sim)
        run: |
          git init -q "$RUNNER_TEMP/simavr"
          git -C "$RUNNER_TEMP/simavr" fetch -q --depth 1 https://github.com/buserror/simavr.git "$SIMAVR_COMMIT"
          git -C "$RUNNER_TEMP/simavr" checkout -q FETCH_HEAD
          mkdir -p build
          scripts/simavr/build.sh "$RUNNER_TEMP/simavr" "$RUNNER_TEMP/avr-gcc-14.1.0-x64-linux/avr/include" build/evia_sim

      - name: Cache the Arduino cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: arduino-cores-${{ runner.os }}-v1

      - name: arduino-cli with the AVR and ESP32 cores
        uses: arduino/setup-arduino-cli@v2

      - name: Install the arduino:avr and esp32:esp32 cores
        run: |
          arduino-cli config init --overwrite --additional-urls "$ESP32_INDEX"
          arduino-cli core update-index
          arduino-cli core install arduino:avr esp32:esp32
          arduino-cli core list

      - name: "Board examples: AVR C in simavr (328P, 2560, 32U4), Arduino sketches for 12 boards"
        run: scripts/check-boards.sh

  # PIC32MX (bare-metal C for XC32): there is no XC32 or chip in CI, so every example for the boards of
  # the three chip families is compiled syntax-only with gcc -Wall -Wextra -Werror against the real
  # device headers (fetched from the Pinguino project; they are not part of this repository).
  pic32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: "PIC32 examples against the device headers (MX1xx/2xx, MX3xx/4xx, MX5xx/6xx/7xx)"
        run: scripts/check-pic32.sh

      - name: "The generated MQTT client against a broker on this computer"
        run: scripts/check-mqtt.sh

  # STM32 (bare-metal C for arm-none-eabi-gcc, and Arduino sketches with STMicroelectronics' core): every
  # example for the five boards, compiled by clang for the core, built with Ubuntu's arm-none-eabi-gcc and
  # newlib, and the Nucleo-F401RE builds run in QEMU (netduinoplus2, an STM32F405) against the interpreter.
  stm32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: arm-none-eabi-gcc, newlib and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm clang

      - name: Cache the STM32 core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: arduino-stm32-core-${{ runner.os }}-v1

      - name: arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install the STMicroelectronics:stm32 core
        run: |
          url=https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          arduino-cli config init --overwrite --additional-urls "$url"
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32
          arduino-cli core list

      - name: "STM32 examples: clang, arm-none-eabi-gcc, QEMU, Arduino sketches for 5 boards"
        run: scripts/check-stm32.sh

      - name: "Packages: install, update, damaged download, remove, self-update"
        run: scripts/check-packages.sh

      - name: "Linux images: Buildroot, Yocto and OpenWrt workspaces for the BeagleBone Black and Raspberry Pi 5"
        run: scripts/check-linux.sh

  # FPGA designs (SystemVerilog, Verilog-2001, VHDL for Artix-7 and GateMate): simulated against the interpreter
  # with Icarus Verilog and GHDL, synthesised with yosys, and for the GateMate placed, routed and packed into a
  # bitstream with nextpnr-himbaechel and gmpack. There is no Vivado or board in CI.
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Find the latest OSS CAD Suite
        id: oss
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/YosysHQ/oss-cad-suite-build/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache the OSS CAD Suite
        id: cache
        uses: actions/cache@v4
        with:
          path: oss-cad-suite
          key: oss-cad-suite-${{ steps.oss.outputs.tag }}

      - name: Download the OSS CAD Suite (yosys, nextpnr, GHDL, Icarus Verilog, gmpack)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/YosysHQ/oss-cad-suite-build/releases/latest \
                --jq '.assets[].browser_download_url | select(test("oss-cad-suite-linux-x64-.*\\.tgz$"))')
          echo "$url"
          curl -sSL -o oss.tgz "$url"
          tar xzf oss.tgz
          rm oss.tgz

      - name: "FPGA examples: simulation against the interpreter, synthesis, GateMate place and route"
        run: |
          source oss-cad-suite/environment
          scripts/check-fpga.sh

  # Windows without Visual Studio: Clang from llvm-mingw (its own libc++ and Windows headers),
  # the same toolchain EVIA Paradigma installs with "Install Clang...".
  windows-llvm-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Download the latest llvm-mingw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/mstorsjo/llvm-mingw/releases/latest \
                --jq '.assets[].browser_download_url | select(test("-ucrt-x86_64\\.zip$"))')
          echo "$url"
          curl -sSL -o llvm-mingw.zip "$url"
          7z x -y -o"$RUNNER_TEMP" llvm-mingw.zip > /dev/null
          bin=$(ls -d "$RUNNER_TEMP"/llvm-mingw-*/bin)
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/clang++" --version

      - name: Generate C++, compile with llvm-mingw Clang (-static), compare with the interpreter
        env:
          CXXFLAGS: -static
        run: scripts/check-examples.sh clang++

      - name: "C and C++ standards with llvm-mingw Clang (-static, no Visual Studio)"
        env:
          CXXFLAGS: -static
          LANGS: c99 c17 c++98 c++14 c++20
        run: CC=clang CXX=clang++ scripts/check-targets.sh

      - name: Check the programs need nothing from Visual Studio
        run: |
          for exe in build/examples/*.exe build/targets/*.exe; do
            dlls=$(llvm-objdump -p "$exe" | sed -n 's/.*DLL Name: //p' | tr '\n' ' ')
            echo "$(basename "$exe"): $dlls"
            if echo "$dlls" | grep -qiE 'vcruntime|msvcp|msvcr|concrt'; then
              echo "::error::$exe depends on the Visual Studio C++ runtime"; exit 1
            fi
          done
          clang++ -dumpmachine
          clang++ -dumpmachine | grep -q windows-gnu

      - name: Download the latest WinLibs GCC (what "Install GCC..." sets up)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/brechtsanders/winlibs_mingw/releases/latest \
                --jq '.assets[].browser_download_url | select(test("/winlibs-x86_64-posix-seh-gcc-[0-9.]+-mingw-w64ucrt-[0-9.]+-r[0-9]+\\.zip$"))' | head -n 1)
          echo "$url"
          curl -sSL -o winlibs.zip "$url"
          7z x -y -o"$RUNNER_TEMP/winlibs" winlibs.zip > /dev/null
          echo "GCC_BIN=$RUNNER_TEMP/winlibs/mingw64/bin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/winlibs/mingw64/bin/g++" --version

      - name: "C and C++ standards with WinLibs GCC (-static, no Visual Studio)"
        env:
          CXXFLAGS: -static
          LANGS: c99 c17 c++98 c++14 c++20
        run: PATH="$GCC_BIN:$PATH" CC=gcc CXX=g++ scripts/check-targets.sh

      - name: Check the GCC programs need no compiler DLLs
        run: |
          for exe in build/targets/*.exe; do
            dlls=$("$GCC_BIN/objdump" -p "$exe" | sed -n 's/.*DLL Name: //p' | tr '\n' ' ')
            if echo "$dlls" | grep -qiE 'vcruntime|msvcp|msvcr|concrt|libstdc\+\+|libgcc|libwinpthread'; then
              echo "::error::$exe depends on $dlls"; exit 1
            fi
          done
          echo "all $(ls build/targets/*.exe | wc -l) programs are self-contained"
