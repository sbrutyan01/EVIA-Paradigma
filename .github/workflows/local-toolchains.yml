name: local-toolchains

# Installs the outside toolchains on a self-hosted runner, so the FPGA and board checks stop being
# skipped there. Start it by hand; it only has to be run once per machine.
#
# It installs under the runner's own home by default and never uses sudo, so nothing system-wide is
# touched and removing the folder undoes it. scripts/local-ci.sh looks in that folder by itself, so
# no repository variables have to be set afterwards.
#
# SAFETY: as with local-ci, workflow_dispatch only - a fork's pull request must never run this.

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'Which toolchains: --fpga, --avr, or both'
        required: false
        default: '--fpga --avr'
      prefix:
        description: 'Where to install (the runner home by default)'
        required: false
        default: ''

concurrency:
  group: local-ci          # never at the same time as a check run on the same machine
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: What is here already
        run: scripts/setup-toolchains.sh --check || true

      - name: Install
        run: |
          prefix="${{ inputs.prefix }}"
          [ -n "$prefix" ] || prefix="$HOME/tools"
          echo "installing ${{ inputs.what }} into $prefix, without sudo"
          scripts/setup-toolchains.sh ${{ inputs.what }} --prefix "$prefix" --no-sudo

      - name: What is here now
        if: always()
        run: |
          scripts/setup-toolchains.sh --check || true
          echo "--- as local-ci.sh will see them:"
          PREFIX="${{ inputs.prefix }}" bash -c '
            : "${PREFIX:=$HOME/tools}"
            for d in "$PREFIX/oss-cad-suite" "$PREFIX/avr-gcc/bin" "$PREFIX/arduino-cli"; do
              [ -e "$d" ] && echo "  found $d" || echo "  absent $d"
            done'
