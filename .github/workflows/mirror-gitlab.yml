name: mirror-gitlab

# Copies this repository into a self-hosted GitLab, from a runner on the machine that hosts it:
# every branch, every tag, and each release with its installers attached. Start it by hand.
#
# It needs one secret, GITLAB_TOKEN (Settings > Secrets and variables > Actions > New repository
# secret), holding a GitLab access token with the api scope. The token is passed to the script
# through the environment, masked in the log by Actions, and never written to a file or to
# .git/config. Nothing is sent anywhere except that GitLab.
#
# SAFETY: dispatch only, like the other self-hosted workflows. A fork's pull request must never be
# able to run something that holds a token and pushes.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'One tag (e.g. v0.6.7), or empty for every release'
        required: false
        default: ''
      prune:
        description: 'Also delete refs that exist only on the GitLab'
        type: boolean
        required: false
        default: false

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # the mirror pushes every branch and tag

      - name: Is the token here
        id: token
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::warning::No GITLAB_TOKEN secret, so nothing was mirrored. Add one in Settings > Secrets and variables >"
            echo "::warning::Actions, from GitLab > User settings > Access tokens with the api scope."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "the secret is set"

      - name: Mirror
        if: steps.token.outputs.present == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_URL: ${{ vars.GITLAB_URL }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
        run: |
          args=""
          [ -n "${{ inputs.tag }}" ] && args="$args ${{ inputs.tag }}"
          [ "${{ inputs.prune }}" = "true" ] && args="$args --prune"
          # GITLAB_URL and GITLAB_PROJECT fall back to the script's own defaults when unset
          [ -n "${GITLAB_URL:-}" ] || unset GITLAB_URL
          [ -n "${GITLAB_PROJECT:-}" ] || unset GITLAB_PROJECT
          scripts/mirror-to-gitlab.sh $args
