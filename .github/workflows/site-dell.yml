name: site-dell

# Builds the website on the machine that serves it and installs it where nginx reads from, so
# evia.am follows a release without anyone copying files by hand. It also makes this machine the source
# of the downloads: the installers go to /var/www/evia/downloads (the site links there), and the package
# server - the application and every toolchain, which the online installers and the application fetch -
# is rebuilt in /var/www/evia/packages (scripts/build-packages.sh).
#
# It runs on the self-hosted runner, writes only inside the web root, and needs no secret: the
# release it builds for is read from GitHub's public API.
#
# Set up once on that machine (see packaging/nginx/README.md):
#   sudo mkdir -p /var/www/evia && sudo chown -R "$USER":"$USER" /var/www/evia
# Nothing here uses sudo; if the web root is not writable the job says so and stops.
#
# SAFETY: dispatch, and the release workflow finishing - never a pull request, which on a public
# repository would let a fork write into the web root of a live site.

on:
  workflow_dispatch:
    inputs:
      downloads:
        description: 'Serve the installers from this machine (evia.am/downloads) instead of GitHub'
        type: boolean
        required: false
        default: true
      packages:
        description: 'Rebuild the package server (evia.am/packages)'
        type: boolean
        required: false
        default: true
  workflow_run:
    workflows: [release]
    types: [completed]

concurrency:
  group: site-dell
  cancel-in-progress: false

jobs:
  deploy:
    # From the release workflow, only after a successful run for a tag: that workflow also runs on
    # every push to main, where the site has not necessarily changed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: [self-hosted, linux]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Is the web root ready
        id: root
        run: |
          root="${WEB_ROOT:-/var/www/evia}"
          if [ ! -d "$root" ]; then
            echo "::warning::$root does not exist, so nothing was deployed. See packaging/nginx/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -w "$root" ]; then
            echo "::warning::$root is not writable by $(id -un), so nothing was deployed."
            echo "::warning::sudo chown -R $(id -un) $root"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "$root is ready"

      - name: Build and install the site
        if: steps.root.outputs.ready == 'true'
        run: |
          # after a release (no inputs) the downloads come from here too
          if [ "${{ inputs.downloads }}" != "false" ]; then
            scripts/deploy-site.sh --downloads
          else
            scripts/deploy-site.sh
          fi

      - name: Rebuild the package server
        # after a release there are no inputs: rebuild then too (a missing input compares equal to false)
        if: steps.root.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.packages)
        run: |
          # the jar of the newest release, exactly as published, is the application package
          tag=$(curl -fsS https://api.github.com/repos/${{ github.repository }}/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          mkdir -p build/release-jar
          url=$(curl -fsS https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag \
                | python3 -c 'import json,sys; print([a["browser_download_url"] for a in json.load(sys.stdin)["assets"] if a["name"].endswith(".jar")][0])')
          curl -fsSL -o "build/release-jar/$(basename "$url")" "$url"
          JAR="build/release-jar/$(basename "$url")" \
          TOOLCHAINS_CACHE="$HOME/.cache/evia-toolchain-downloads" \
            scripts/build-packages.sh --publish "${WEB_ROOT:-/var/www/evia}"

      - name: What is being served
        if: steps.root.outputs.ready == 'true'
        run: |
          root="${WEB_ROOT:-/var/www/evia}"
          echo "files: $(find "$root" -type f | wc -l)"
          echo "version on the page: $(grep -oE 'Download [0-9]+\.[0-9]+\.[0-9]+' "$root/index.html" | head -1)"
          ls "$root/downloads" 2> /dev/null | head -8 || echo "(downloads still come from GitHub)"
          python3 -c 'import json,sys; [print("package", p["id"], ", ".join(sorted(p["files"]))) for p in json.load(open(sys.argv[1]))["packages"]]' "$root/packages/index.json" || true
