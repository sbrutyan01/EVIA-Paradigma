name: site

# Builds the project website (site/ + screenshots + real generator output) and publishes it
# to the gh-pages branch, which GitHub Pages serves at https://sbrutyan01.github.io/EVIA-Paradigma/
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "examples/tutorial.evia"
      - "src/main/java/evia/paradigma/EmbeddedRuntime.java"
      - "scripts/build-site.py"
      - "src/main/java/evia/paradigma/CodeGenerator.java"
      - "src/main/java/evia/paradigma/Runtimes.java"
      - "pom.xml"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  # A release created by the release workflow does NOT fire the "release" trigger above: GitHub does
  # not let an event made with the default GITHUB_TOKEN start another workflow. So the site also
  # rebuilds when that workflow finishes, which is what actually happens when a version is tagged.
  # The trigger above still covers a release published by hand in the web interface.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    # The release workflow also runs on every push to main, and those need no rebuild here - the
    # push trigger above already covers the files the site is built from. So from workflow_run,
    # rebuild only after a successful run for a tag, which is what publishing a version looks like.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build the app (the site shows its real generated code)
        run: mvn -B -DskipTests package

      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # download links: the highest published (not draft, not pre-release) version, so a new version's
          # links appear once it is released, whether or not it is marked "latest" on GitHub
          export SITE_VERSION=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' | sort -V | tail -n 1 || true)
          echo "download links for ${SITE_VERSION:-the version of the jar}"
          python3 scripts/build-site.py "$(ls target/evia-paradigma-*.jar | head -n 1)"

      - name: Publish to gh-pages
        run: |
          cd build/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site for ${GITHUB_SHA::7}"
          # GitHub sometimes answers a push with "Internal Server Error": try again
          for i in 1 2 3 4 5; do
            git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:refs/heads/gh-pages && exit 0
            echo "push attempt $i failed"; sleep $((i * 15))
          done
          exit 1
