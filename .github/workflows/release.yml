name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# publishing a release on github.com also pushes its tag: run once at a time per tag
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  CLANG_VERSION: "23"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Install Clang ${{ env.CLANG_VERSION }}
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CLANG_VERSION"

      - name: Verify generated C++ against the interpreter
        run: scripts/check-examples.sh "clang++-$CLANG_VERSION"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          notes="docs/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # release was created on github.com: attach the build, fill in notes if empty
            gh release upload "$TAG" target/evia-paradigma-*.jar LICENSE --clobber
            if [ -f "$notes" ] && [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --title "EVIA Paradigma $TAG" --notes-file "$notes"
            fi
          else
            if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
            gh release create "$TAG" target/evia-paradigma-*.jar LICENSE \
              --title "EVIA Paradigma $TAG" "${args[@]}"
          fi
