name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CLANG_VERSION: "23"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      - name: Install Clang ${{ env.CLANG_VERSION }}
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CLANG_VERSION"

      - name: Verify generated C++ against the interpreter
        run: scripts/check-examples.sh "clang++-$CLANG_VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" target/evia-paradigma-*.jar LICENSE \
            --title "EVIA Paradigma $GITHUB_REF_NAME" "${args[@]}"
