name: release

# Builds native installers with their own Java runtime:
#   Windows 10/11 x64 .exe and Ubuntu/Debian .deb. (macOS .dmg builds are off for now: add the two macos-* matrix entries back.)
# On pushes to main the installers are built and tested (artifacts only).
# Publishing a GitHub release (or pushing a v* tag) attaches them to the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach installers to (e.g. v0.2.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  CLANG_VERSION: "23"

jobs:
  jar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - name: Install Clang ${{ env.CLANG_VERSION }}
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        run: |
          # apt.llvm.org is sometimes unreachable: retry, then fall back to Ubuntu's Clang
          for i in 1 2 3 4 5; do
            if wget -qO llvm.sh https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh "$CLANG_VERSION"; then
              echo "CXX=clang++-$CLANG_VERSION" >> "$GITHUB_ENV"
              break
            fi
            echo "apt.llvm.org attempt $i failed"; sleep 30
          done
          if ! grep -q '^CXX=' "$GITHUB_ENV"; then
            echo "::warning::apt.llvm.org unreachable - checking with Ubuntu's clang++ instead of Clang $CLANG_VERSION"
            sudo apt-get install -y clang
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Verify generated C++ against the interpreter
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        run: |
          "$CXX" --version
          scripts/check-examples.sh "$CXX"
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/evia-paradigma-*.jar

  package:
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022,   kind: windows }
          - { os: ubuntu-24.04,   kind: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist/input
      - name: WiX Toolset for the Windows installer
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) { choco install wixtoolset -y --no-progress; $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" | Select-Object -First 1 }
            $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build installer
        run: packaging/package.sh ${{ matrix.kind }}
      - name: Test the .deb on Ubuntu 22.04/24.04 and Debian 12/13
        if: matrix.kind == 'linux'
        run: packaging/test-deb.sh packages/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.kind }}
          path: packages/*

  publish:
    needs: [jar, package]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          ls -l assets
          files=(assets/* LICENSE)
          notes="docs/release-notes/$TAG.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            if [ -f "$notes" ] && [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --title "EVIA Paradigma $TAG" --notes-file "$notes"
            fi
          else
            if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
            gh release create "$TAG" "${files[@]}" --title "EVIA Paradigma $TAG" "${args[@]}"
          fi
