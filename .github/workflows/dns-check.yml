name: dns-check

# Read-only status of the web server setup on this machine: the firewall, nginx, where GitLab
# listens, whether the site is in place, and what each port answers. Nothing aborts the job.
# Temporary.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'The domain to check as well'
        required: false
        default: 'evia.am'

jobs:
  check:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Firewall
        continue-on-error: true
        run: |
          set +e
          PATH="/usr/sbin:/sbin:$PATH"     # ufw and nginx live there, off a user's PATH
          if command -v ufw > /dev/null; then
            ufw status verbose 2>/dev/null | sed 's/^/   /' || echo "   ufw installed, status needs root"
          else
            echo "   ufw not installed yet"
          fi

      - name: nginx and GitLab
        continue-on-error: true
        run: |
          set +e
          PATH="/usr/sbin:/sbin:$PATH"
          echo "   nginx binary   : $(command -v nginx || echo 'not installed yet')"
          command -v nginx > /dev/null && nginx -v 2>&1 | sed 's/^/   version        : /'
          echo "   nginx running  : $(systemctl is-active nginx 2>/dev/null || echo unknown)"
          echo "   gitlab running : $(systemctl is-active gitlab-runsvdir 2>/dev/null || echo unknown)"
          echo "   --- ports on all addresses:"
          ss -ltnH 2>/dev/null | awk '$4 ~ /^(0\.0\.0\.0|\[::\]|\*):/ {print "       " $4}' \
            | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.x/g' | sort -u
          echo "   --- is GitLab on localhost:8081 now?"
          ss -ltnH 2>/dev/null | grep -q '127.0.0.1:8081' \
            && echo "       yes - moved off port 80" || echo "       not yet"

      - name: The site
        continue-on-error: true
        run: |
          set +e
          root=/var/www/evia
          if [ -d "$root" ]; then
            echo "   $root exists, $(find "$root" -type f 2>/dev/null | wc -l) files"
            [ -f "$root/index.html" ] && echo "   index.html: $(wc -c < "$root/index.html") bytes"
            grep -oE 'Download [0-9]+\.[0-9]+\.[0-9]+' "$root/index.html" 2>/dev/null | head -1 \
              | sed 's/^/   version on the page: /'
            ls "$root/downloads" 2>/dev/null | sed 's/^/   download: /' | head -5
            for l in ru hy de ja zh-CN zh-TW; do
              [ -f "$root/$l/index.html" ] || echo "   MISSING language: $l"
            done
          else
            echo "   $root does not exist yet"
          fi

      - name: What answers
        continue-on-error: true
        run: |
          set +e
          mask() { sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.x/g'; }
          own=$(ip -4 -o addr show scope global 2>/dev/null \
                | awk '$2 !~ /docker|tailscale/ {split($4,a,"/"); print a[1]; exit}')
          d="${{ inputs.domain }}"
          for u in "http://$own/" "https://$own/" "http://$d/" "https://$d/" \
                   "http://www.$d/" "https://www.$d/"; do
            printf '   %-28s ' "$(echo "$u" | mask)"
            curl -sSk -m 8 -o /tmp/b -w 'HTTP %{http_code}\n' "$u" 2>&1 | mask | head -1
            t=$(grep -oiE '<title>[^<]*' /tmp/b 2>/dev/null | head -1 | cut -c8-60)
            [ -n "$t" ] && echo "       title: $t"
            rm -f /tmp/b
          done
          echo "   --- is the certificate trusted? (no -k, so this validates it)"
          for n in "$d" "www.$d"; do
            printf '       https://%-16s ' "$n"
            curl -sS -m 10 -o /dev/null -w 'VALID, HTTP %{http_code}\n' "https://$n/" 2>&1 | head -1
          done
          echo "   --- what the certificate presents (read over the wire, no root needed):"
          echo | openssl s_client -connect "www.$d:443" -servername "www.$d" 2>/dev/null \
            | openssl x509 -noout -issuer -dates -ext subjectAltName 2>/dev/null | sed 's/^/       /' \
            || echo "       could not read it"
          echo "   --- what the live certificate covers:"
          for c in /etc/letsencrypt/live/*/fullchain.pem; do
            [ -f "$c" ] || continue
            echo "       $c"
            openssl x509 -in "$c" -noout -issuer -dates 2>/dev/null | sed 's/^/         /'
            openssl x509 -in "$c" -noout -ext subjectAltName 2>/dev/null | tail -1 | sed 's/^/         names:/'
          done
          echo "   --- certificates:"
          ls /etc/letsencrypt/live/*/fullchain.pem 2>/dev/null | sed 's/^/       /' \
            || echo "       none from Let's Encrypt yet"
          ls /etc/ssl/evia/fullchain.pem 2>/dev/null | sed 's/^/       /' \
            || echo "       none of our own yet"
