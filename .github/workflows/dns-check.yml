name: dns-check

# Read-only status of the web server setup on this machine: the firewall, nginx, where GitLab
# listens, whether the site is in place, and what each port answers. Nothing aborts the job.
# Temporary.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'The domain to check as well'
        required: false
        default: 'evia.am'

jobs:
  check:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Firewall
        continue-on-error: true
        run: |
          set +e
          PATH="/usr/sbin:/sbin:$PATH"     # ufw and nginx live there, off a user's PATH
          if command -v ufw > /dev/null; then
            ufw status verbose 2>/dev/null | sed 's/^/   /' || echo "   ufw installed, status needs root"
          else
            echo "   ufw not installed yet"
          fi

      - name: nginx and GitLab
        continue-on-error: true
        run: |
          set +e
          PATH="/usr/sbin:/sbin:$PATH"
          echo "   nginx binary   : $(command -v nginx || echo 'not installed yet')"
          command -v nginx > /dev/null && nginx -v 2>&1 | sed 's/^/   version        : /'
          echo "   nginx running  : $(systemctl is-active nginx 2>/dev/null || echo unknown)"
          echo "   gitlab running : $(systemctl is-active gitlab-runsvdir 2>/dev/null || echo unknown)"
          echo "   --- ports on all addresses:"
          ss -ltnH 2>/dev/null | awk '$4 ~ /^(0\.0\.0\.0|\[::\]|\*):/ {print "       " $4}' \
            | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.x/g' | sort -u
          echo "   --- is GitLab on localhost:8081 now?"
          ss -ltnH 2>/dev/null | grep -q '127.0.0.1:8081' \
            && echo "       yes - moved off port 80" || echo "       not yet"

      - name: The site
        continue-on-error: true
        run: |
          set +e
          root=/var/www/evia
          if [ -d "$root" ]; then
            echo "   $root exists, $(find "$root" -type f 2>/dev/null | wc -l) files"
            [ -f "$root/index.html" ] && echo "   index.html: $(wc -c < "$root/index.html") bytes"
            grep -oE 'Download [0-9]+\.[0-9]+\.[0-9]+' "$root/index.html" 2>/dev/null | head -1 \
              | sed 's/^/   version on the page: /'
            ls "$root/downloads" 2>/dev/null | sed 's/^/   download: /' | head -5
            for l in ru hy de ja zh-CN zh-TW; do
              [ -f "$root/$l/index.html" ] || echo "   MISSING language: $l"
            done
          else
            echo "   $root does not exist yet"
          fi

      - name: What answers
        continue-on-error: true
        run: |
          set +e
          mask() { sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.x/g'; }
          own=$(ip -4 -o addr show scope global 2>/dev/null \
                | awk '$2 !~ /docker|tailscale/ {split($4,a,"/"); print a[1]; exit}')
          d="${{ inputs.domain }}"
          for u in "http://$own/" "https://$own/" "http://$d/" "https://$d/" \
                   "http://www.$d/" "https://www.$d/"; do
            printf '   %-28s ' "$(echo "$u" | mask)"
            curl -sSk -m 8 -o /tmp/b -w 'HTTP %{http_code}\n' "$u" 2>&1 | mask | head -1
            t=$(grep -oiE '<title>[^<]*' /tmp/b 2>/dev/null | head -1 | cut -c8-60)
            [ -n "$t" ] && echo "       title: $t"
            rm -f /tmp/b
          done
          echo "   --- is the certificate trusted? (no -k, so this validates it)"
          for n in "$d" "www.$d"; do
            printf '       https://%-16s ' "$n"
            curl -sS -m 10 -o /dev/null -w 'VALID, HTTP %{http_code}\n' "https://$n/" 2>&1 | head -1
          done
          echo "   --- what the certificate presents (read over the wire, no root needed):"
          echo | openssl s_client -connect "www.$d:443" -servername "www.$d" 2>/dev/null \
            | openssl x509 -noout -issuer -dates -ext subjectAltName 2>/dev/null | sed 's/^/       /' \
            || echo "       could not read it"
          echo "   --- what the live certificate covers:"
          for c in /etc/letsencrypt/live/*/fullchain.pem; do
            [ -f "$c" ] || continue
            echo "       $c"
            openssl x509 -in "$c" -noout -issuer -dates 2>/dev/null | sed 's/^/         /'
            openssl x509 -in "$c" -noout -ext subjectAltName 2>/dev/null | tail -1 | sed 's/^/         names:/'
          done
          echo "   --- certificates:"
          ls /etc/letsencrypt/live/*/fullchain.pem 2>/dev/null | sed 's/^/       /' \
            || echo "       none from Let's Encrypt yet"
          ls /etc/ssl/evia/fullchain.pem 2>/dev/null | sed 's/^/       /' \
            || echo "       none of our own yet"

      - name: Proxies, docker, and the camera
        continue-on-error: true
        run: |
          set +e
          echo "--- proxy settings that could redirect traffic:"
          env | grep -iE '^(http_proxy|https_proxy|all_proxy|no_proxy)=' || echo "   none in this environment"
          for f in /etc/environment /etc/apt/apt.conf.d/*proxy* /etc/profile.d/*proxy*; do
            [ -f "$f" ] && grep -ilE 'proxy' "$f" | sed 's/^/   mentions proxy: /'
          done
          echo "--- docker, if readable by this account:"
          docker ps --format '   {{.Names}}  {{.Image}}  {{.Ports}}' 2>/dev/null \
            || echo "   not readable (account is not in the docker group)"
          echo "--- what is really bound to 443, and by what (needs root for the name):"
          ss -ltnp 2>/dev/null | grep ':443' | sed 's/^/   /' || echo "   no process name without root"
          echo "--- the camera, as reported:"
          for u in "http://127.0.0.1:8443/stream" "https://127.0.0.1:8443/stream" \
                   "http://127.0.0.1:8443/" "https://127.0.0.1:8443/"; do
            printf '   %-34s ' "$u"
            curl -sSk -m 8 -o /dev/null -w 'HTTP %{http_code}  %{content_type}\n' "$u" 2>&1 | head -1
          done
          echo "--- and port 443 from this machine, by address and by name:"
          for u in "https://127.0.0.1/" "https://109.75.45.124/" "https://evia.am/"; do
            printf '   %-28s ' "$u"
            curl -sSk -m 8 -o /tmp/x -w 'HTTP %{http_code}\n' "$u" 2>&1 | head -1
            grep -oiE '<title>[^<]*' /tmp/x 2>/dev/null | head -1 | cut -c8-60 | sed 's/^/       /'
            rm -f /tmp/x
          done

      - name: The camera, device and service
        continue-on-error: true
        run: |
          set +e
          echo "--- USB devices that look like a camera:"
          if command -v lsusb > /dev/null; then
            lsusb | grep -iE 'cam|video|uvc|imaging|logitech|microdia|realtek|sunplus' || echo "   nothing obvious in lsusb"
          else
            echo "   lsusb not installed"
          fi
          echo "--- video devices:"
          ls -l /dev/video* 2>/dev/null | sed 's/^/   /' || echo "   no /dev/video* at all"
          echo "--- can this account read them (it is in the video group)?"
          for d in /dev/video*; do
            [ -e "$d" ] || continue
            [ -r "$d" ] && echo "   readable: $d" || echo "   NOT readable: $d"
          done
          echo "--- what the kernel says about a UVC camera:"
          (dmesg 2>/dev/null || journalctl -k --no-pager 2>/dev/null) \
            | grep -iE 'uvcvideo|video[0-9]|usb .*camera' | tail -5 | sed 's/^/   /' \
            || echo "   kernel log not readable without root"
          echo "--- the service on 8443, by path:"
          for pth in / /stream /stream.mjpg /video /video_feed /mjpeg /api/stream /snapshot /index.html; do
            printf '   https://127.0.0.1:8443%-14s ' "$pth"
            curl -sSk -m 8 -o /tmp/c -w 'HTTP %{http_code}  %{content_type}\n' "https://127.0.0.1:8443$pth" 2>&1 | head -1
            head -c 120 /tmp/c 2>/dev/null | tr -d '\n' | sed 's/^/        body: /' ; echo
            rm -f /tmp/c
          done
          echo "--- and through the site's nginx, if --config has been run:"
          for u in https://127.0.0.1/stream https://127.0.0.1/camera/ https://127.0.0.1/camera/stream; do
            printf '   %-34s ' "$u"
            curl -sSk -m 8 -o /tmp/c -w 'HTTP %{http_code}  %{content_type}\n' "$u" 2>&1 | head -1
            head -c 120 /tmp/c 2>/dev/null | tr -d '\n' | sed 's/^/        body: /' ; echo
            rm -f /tmp/c
          done

  outside:
    # A GitHub-hosted runner: the public internet, public DNS, no cache of ours and nothing of this
    # machine's resolver. The nearest thing to a visitor's browser that can be measured from here.
    runs-on: ubuntu-24.04
    steps:
      - name: What the outside world sees
        continue-on-error: true
        run: |
          set +e
          d="${{ inputs.domain }}"
          for n in "$d" "www.$d"; do
            echo "=== $n"
            echo "   A    : $(getent ahostsv4 "$n" | awk '{print $1}' | sort -u | tr '\n' ' ')"
            echo "   AAAA : $(getent ahostsv6 "$n" | awk '$1 ~ /:/ && $1 !~ /^::ffff:/ {print $1}' | sort -u | tr '\n' ' ')"
            for scheme in http https; do
              printf '   %-6s ' "$scheme"
              curl -sS -m 15 -o /tmp/b -w 'HTTP %{http_code} from %{remote_ip}\n' "$scheme://$n/" 2>&1 | head -1
              t=$(grep -oiE '<title>[^<]*' /tmp/b 2>/dev/null | head -1 | cut -c8-70)
              [ -n "$t" ] && echo "          title: $t"
              grep -qiE 'id="devices"|mqtt' /tmp/b 2>/dev/null && echo "          >>> THIS IS THE MQTT PAGE"
              grep -qi 'EVIA Paradigma' /tmp/b 2>/dev/null && echo "          >>> this is the Paradigma site"
              rm -f /tmp/b
            done
          done
          echo "=== the certificate the outside world is given:"
          echo | openssl s_client -connect "$d:443" -servername "$d" 2>/dev/null \
            | openssl x509 -noout -issuer -ext subjectAltName 2>/dev/null | sed 's/^/   /'
