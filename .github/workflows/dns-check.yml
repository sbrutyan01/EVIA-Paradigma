name: dns-check

# Read-only: what this machine can tell us about serving a domain from it.
# Addresses are masked; it changes nothing and needs no secret. Temporary.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'The domain to check'
        required: false
        default: 'evia.am'

jobs:
  check:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Domain, address, and what answers
        run: |
          d="${{ inputs.domain }}"
          mask() { sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$/\1.x/'; }
          ips=$(getent ahostsv4 "$d" 2>/dev/null | awk '{print $1}' | sort -u)
          pub=$(curl -fsS -m 8 https://api.ipify.org 2>/dev/null || true)
          echo "domain      : $d"
          echo "resolves to : $(echo "${ips:-nothing}" | mask | tr '\n' ' ')"
          echo "this network: $(echo "${pub:-unknown}" | mask)"
          if [ -n "$pub" ] && echo "$ips" | grep -qx "$pub"; then echo "match       : yes"; else echo "match       : no"; fi
          for u in "http://$d/" "https://$d/"; do
            printf '%-22s ' "$u"
            curl -sS -o /dev/null -m 10 -w 'HTTP %{http_code}\n' "$u" 2>&1 | head -1
          done
          echo "--- listening here:"
          ss -ltn 2>/dev/null | awk 'NR==1 || $4 ~ /:(80|443|8081)$/'

      - name: Can this runner change the machine
        run: |
          echo "runner account: $(id -un)   groups: $(id -Gn)"
          if sudo -n true 2> /dev/null; then
            echo "PASSWORDLESS SUDO: YES - this runner can become root without a password"
            sudo -n -l 2>/dev/null | tail -5
          else
            echo "passwordless sudo: no - this runner cannot install packages or edit /etc"
          fi
          echo "--- is what the web server needs already there:"
          for p in /var/www/evia /var/www/acme /etc/nginx /etc/letsencrypt/live; do
            [ -e "$p" ] && echo "  exists  $p" || echo "  absent  $p"
          done
          for c in nginx certbot; do printf '  %-8s %s\n' "$c" "$(command -v $c || echo '-')"; done
