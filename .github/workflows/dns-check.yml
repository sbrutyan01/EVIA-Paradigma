name: dns-check

# Read-only: every record a browser might follow for a domain, and what each of them answers.
# A browser prefers IPv6 when there is an AAAA record, so a v4-only check can miss the host that
# visitors actually reach. Addresses masked; prints status, server and title only. Temporary.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'The domain to check'
        required: false
        default: 'evia.am'

jobs:
  check:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Every record, and what each answers
        run: |
          d="${{ inputs.domain }}"
          mask() { sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.x/g; s/(([0-9a-f]{1,4}:){3})[0-9a-f:]+/\1x/gi'; }

          echo "=== A records (IPv4):"
          getent ahostsv4 "$d" 2>/dev/null | awk '{print "   " $1}' | sort -u | mask || echo "   none"
          echo "=== AAAA records (IPv6) - a browser prefers these:"
          getent ahostsv6 "$d" 2>/dev/null | awk '$1 ~ /:/ {print "   " $1}' | sort -u | mask || echo "   none"

          echo "=== this machine's own addresses, for comparison:"
          ip -o addr show scope global 2>/dev/null | awk '{print "   " $2, $4}' | mask

          probe() {
            printf '\n--- %s\n' "$2"
            curl -sSk -m 10 -o /dev/null -w '    HTTP %{http_code}  via %{remote_ip}\n' $1 "$2" 2>&1 \
              | mask | head -2
            t=$(curl -sSk -m 10 $1 "$2" 2>/dev/null | tr -d '\n' | grep -oiE '<title>[^<]*' | head -1 | cut -c8-80)
            [ -n "$t" ] && echo "    title: $t"
            curl -sSk -m 10 $1 "$2" 2>/dev/null | grep -qiE 'id="devices"|mqtt|pic32' \
              && echo "    mentions devices/mqtt/pic32"
          }

          probe "-4" "http://$d/"
          probe "-4" "https://$d/"
          probe "-6" "http://$d/"
          probe "-6" "https://$d/"

      - name: Is anything here on 443 at all
        run: |
          echo "--- ports 80 and 443, every address family:"
          ss -ltnH 2>/dev/null | awk '$4 ~ /:(80|443)$/ {print "   " $4}' | sort -u \
            | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.x/g' || echo "   nothing"
          echo "--- if 443 is absent above, nothing on this machine serves https."
