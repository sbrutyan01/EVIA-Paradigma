name: dns-check

# Read-only. Asks the machine itself what it serves, by address rather than by name, so a flaky
# DNS record cannot hide the answer. Nothing here may abort the job: every probe swallows its own
# failure, because "it did not answer" is a result worth printing, not an error.
# Temporary.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'The domain to check as well'
        required: false
        default: 'evia.am'

jobs:
  check:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Everything this machine is listening on
        continue-on-error: true
        run: |
          set +e
          echo "--- every listening TCP socket, unfiltered:"
          ss -ltnH 2>/dev/null | awk '{print "   " $4}' | sort -u \
            | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.x/g'
          echo "--- is 443 among them?"
          if ss -ltnH 2>/dev/null | grep -qE ':443$|:443 '; then
            echo "   YES - something here serves https"
          else
            echo "   NO - nothing on this machine listens on 443"
          fi

      - name: What answers on this machine's own public address
        continue-on-error: true
        run: |
          set +e
          mask() { sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.x/g'; }
          own=$(ip -4 -o addr show scope global 2>/dev/null \
                | awk '$2 !~ /docker|tailscale/ {split($4,a,"/"); print a[1]; exit}')
          echo "this machine's address: $(echo "$own" | mask)"
          for u in "http://$own/" "https://$own/" "http://$own:8060/" "https://$own:8443/"; do
            printf '\n--- %s\n' "$(echo "$u" | mask)"
            curl -sSk -m 8 -o /tmp/body -w '    HTTP %{http_code}\n' "$u" 2>&1 | mask | head -2
            grep -oiE '<title>[^<]*' /tmp/body 2>/dev/null | head -1 | cut -c8-80 | sed 's/^/    title: /'
            grep -qiE 'id="devices"|data-devices|pic32' /tmp/body 2>/dev/null \
              && echo "    >>> this one contains a devices/pic32 page"
            rm -f /tmp/body
          done

      - name: And by name, if it resolves at the moment
        continue-on-error: true
        run: |
          set +e
          d="${{ inputs.domain }}"
          echo "A    : $(getent ahostsv4 "$d" 2>/dev/null | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "AAAA : $(getent ahostsv6 "$d" 2>/dev/null | awk '$1 ~ /:/ {print $1}' | sort -u | tr '\n' ' ')"
          for u in "http://$d/" "https://$d/"; do
            printf '%-24s ' "$u"
            curl -sSk -m 8 -o /dev/null -w 'HTTP %{http_code}\n' "$u" 2>&1 | head -1
          done
