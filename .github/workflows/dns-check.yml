name: dns-check

# Read-only: what is already being served on this machine, and on which port. Prints status lines,
# server headers and page titles only - no page bodies, no addresses beyond a masked form.
# Temporary.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'The domain to check'
        required: false
        default: 'evia.am'

jobs:
  check:
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: What answers, and where
        run: |
          mask() { sed -E 's/([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+/\1.x/g'; }
          d="${{ inputs.domain }}"

          echo "--- listening on all addresses:"
          ss -ltnH 2>/dev/null | awk '$4 ~ /^(0\.0\.0\.0|\[::\]|\*):/ {print "  " $4}' | mask | sort -u

          probe() {   # url
            printf '\n=== %s\n' "$1"
            curl -sSkI -m 8 "$1" 2>&1 | grep -iE '^(HTTP/|server|location|content-type)' | sed 's/^/    /' \
              || echo "    no answer"
            # the <title> only, so we learn which application it is without printing a page
            t=$(curl -sSk -m 8 "$1" 2>/dev/null | tr -d '\n' | grep -oiE '<title>[^<]*' | head -1 | cut -c8-80)
            [ -n "$t" ] && echo "    title: $t"
            # does it mention a devices section
            if curl -sSk -m 8 "$1" 2>/dev/null | grep -qiE 'id="devices"|#devices'; then
              echo "    contains a \"devices\" section"
            fi
          }

          for u in http://127.0.0.1/ https://127.0.0.1/ http://127.0.0.1:8060/ \
                   https://127.0.0.1:8443/ "http://$d/" "https://$d/"; do
            probe "$u"
          done

      - name: Where those services come from
        run: |
          echo "--- nginx present:  $(command -v nginx || echo no)"
          echo "--- units that look like a web or camera service:"
          systemctl list-units --type=service --state=running --no-legend --no-pager 2>/dev/null \
            | awk '$1 ~ /(nginx|apache|caddy|camera|cam|stream|mjpg|motion|mosquitto|node|gunicorn|uvicorn|flask)/ {print "  " $1}' \
            || echo "  none matched"
          echo "--- docker containers, if readable:"
          docker ps --format '  {{.Names}}  {{.Image}}  {{.Ports}}' 2>/dev/null || echo "  docker not readable from here"
