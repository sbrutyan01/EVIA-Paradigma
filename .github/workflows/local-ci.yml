name: local-ci

# The whole check suite on a machine of your own, through a self-hosted runner, using the toolchains
# installed there instead of downloading them on every run. Start it by hand from the Actions tab.
#
# SAFETY: this repository is public, so this workflow must never be triggered by a pull request.
# A fork's pull request would then run its own code on your computer. workflow_dispatch and a push to
# main are the only triggers here on purpose; keep it that way, and keep
# Settings > Actions > General > "Require approval for all external contributors" on.

on:
  workflow_dispatch:
    inputs:
      checks:
        description: 'Which checks (space separated: build app mqtt examples targets zoom pic32 boards fpga), empty for all'
        required: false
        default: ''

concurrency:
  group: local-ci
  cancel-in-progress: false

jobs:
  checks:
    # any self-hosted Linux runner of this repository: the labels every runner carries by default,
    # so no custom label has to be set when registering one
    runs-on: [self-hosted, linux]
    timeout-minutes: 180
    env:
      # Empty unless set as repository variables (Settings > Actions > Variables): a tool already on the
      # runner's PATH needs nothing here, and an empty value adds no bogus PATH entry.
      OSS_CAD_SUITE: ${{ vars.OSS_CAD_SUITE }}
      XC32_BIN: ${{ vars.XC32_BIN }}
      AVR_GCC_BIN: ${{ vars.AVR_GCC_BIN }}
    steps:
      - uses: actions/checkout@v5

      - name: What this machine has
        run: |
          echo "runner: $(hostname), $(nproc) cores, $(free -g | awk '/Mem:/{print $2}') GB"
          java -version 2>&1 | head -2
          mvn -v | head -1
          for t in clang++ g++ xc32-gcc avr-gcc arduino-cli yosys iverilog ghdl xvfb-run; do
            printf '%-12s %s\n' "$t" "$(command -v $t || echo '-')"
          done

      - name: Build and run the checks
        run: scripts/local-ci.sh ${{ inputs.checks }}

      - name: Keep the jar and the generated code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ci
          path: |
            target/evia-paradigma-*.jar
            build/examples/*.cpp
            build/mqtt/*.log
          if-no-files-found: ignore
