name: gitlab-push

# Pushes the current main, and optionally a tag, to the self-hosted GitLab - from a runner on the
# machine that hosts it, which is the only thing that can reach it.
#
# It uses whatever Git credentials that machine already has for the GitLab (its credential helper).
# It asks for no token and sets none up: if nothing is cached there, the push fails and says so,
# and the GITLAB_TOKEN route (mirror-gitlab, or scripts/mirror-to-gitlab.sh) is the alternative.
#
# This pushes only to the GitLab. Nothing here pushes to GitHub.
#
# SAFETY: dispatch only, as with the other self-hosted workflows.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Also create and push this tag (e.g. v0.6.7), empty for the branch alone'
        required: false
        default: ''
      force:
        description: 'Overwrite the GitLab branch (needed when its history is unrelated)'
        type: boolean
        required: false
        default: false

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  push:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: What is on the GitLab now
        env:
          GITLAB_URL: ${{ vars.GITLAB_URL }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
        run: |
          url="${GITLAB_URL:-https://git.evia.am}"
          project="${GITLAB_PROJECT:-evia/evia-paradigma}"
          echo "remote: $url/$project.git"
          echo "::group::its refs"
          git ls-remote "$url/$project.git" 2>&1 | head -20 || echo "cannot list - no credentials, or it is unreachable"
          echo "::endgroup::"
          echo "here: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

      - name: Push
        env:
          GITLAB_URL: ${{ vars.GITLAB_URL }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
        run: |
          set -o pipefail
          url="${GITLAB_URL:-https://git.evia.am}"
          project="${GITLAB_PROJECT:-evia/evia-paradigma}"
          remote="$url/$project.git"
          tag="${{ inputs.tag }}"
          refs="HEAD:refs/heads/main"
          if [ -n "$tag" ]; then
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null \
              || git -c user.name="Sergey Brutyan" -c user.email=sbrutyan01@gmail.com \
                     tag -a "$tag" -m "EVIA Paradigma ${tag#v}"
            echo "tag $tag -> $(git rev-parse --short "$tag")"
            refs="$refs refs/tags/$tag:refs/tags/$tag"
          fi
          [ "${{ inputs.force }}" = "true" ] && refs=$(echo "$refs" | sed 's/\([^ ]*\)/+\1/g')
          echo "pushing: $refs"
          # shellcheck disable=SC2086
          if ! git push "$remote" $refs 2>&1; then
            echo "::error::The push to the GitLab failed. If it was rejected as non-fast-forward, its"
            echo "::error::history is unrelated - run this again with force. If it asked for a password"
            echo "::error::or said authentication failed, this machine has no cached credentials for"
            echo "::error::that GitLab: use the GITLAB_TOKEN route instead."
            exit 1
          fi
          echo "pushed. $url/$project/-/tree/main"
