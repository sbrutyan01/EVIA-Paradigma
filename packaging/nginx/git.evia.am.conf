# nginx for git.evia.am: GitLab, reachable from the internet over HTTPS.
#
# Installed by packaging/nginx/gitlab-public.sh, which also gets the certificate and points GitLab's
# own address at this name. GitLab itself stays on 127.0.0.1:8081; only this proxy faces outside.
#
# What protects it now that it is public is GitLab's own sign-in, not an address list: sign-ups are
# off, the rate limits are on, and the projects are private. Turn on two-factor sign-in for root.
# The private block in evia.am.conf (http://dell) keeps working on this machine and over Tailscale.

server {
    listen 80;
    listen [::]:80;
    server_name git.evia.am;

    # Let's Encrypt renewals need this path on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # Nothing about GitLab over plain http: a password must never cross the internet in the clear.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name git.evia.am;

    ssl_certificate     /etc/letsencrypt/live/git.evia.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.evia.am/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 512m;   # git pushes and release uploads

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl   on;
        proxy_set_header Upgrade           $http_upgrade;   # GitLab's live updates use websockets
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300;
        proxy_request_buffering off;     # large pushes stream through instead of filling a disk first
    }
}

# "Connection: upgrade" only when the client asked for a websocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
