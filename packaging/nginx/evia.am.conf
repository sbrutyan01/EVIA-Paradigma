# nginx for evia.am, served from the workstation itself.
#
# Install:
#   sudo cp packaging/nginx/evia.am.conf /etc/nginx/sites-available/evia.am
#   sudo ln -sf /etc/nginx/sites-available/evia.am /etc/nginx/sites-enabled/evia.am
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# It assumes GitLab's own nginx has been moved off port 80 to 127.0.0.1:8081 - see
# packaging/nginx/README.md. Three things matter here:
#
#   1. the public site is the ONLY thing reachable from the internet;
#   2. GitLab is proxied for this network only, by address, so a Host header from outside
#      cannot reach it even if a name resolves to this machine;
#   3. anything asking for a name we do not serve gets nothing at all, rather than whichever
#      server block happens to be first.

# Requests with an unknown or missing Host: drop the connection without answering. This is what
# keeps a scanner that simply connects to the address from being shown the site or anything else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # certbot writes a real certificate for evia.am below; this block only needs to terminate TLS
    # to be able to refuse, so it reuses the same files.
    ssl_certificate     /etc/letsencrypt/live/evia.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evia.am/privkey.pem;
    return 444;
}

# ---------------------------------------------------------------- the public site
server {
    listen 80;
    listen [::]:80;
    server_name evia.am www.evia.am;

    # Let's Encrypt renewals need this path on port 80 and nothing else does.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://evia.am$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.evia.am;

    ssl_certificate     /etc/letsencrypt/live/evia.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evia.am/privkey.pem;

    return 301 https://evia.am$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name evia.am;

    ssl_certificate     /etc/letsencrypt/live/evia.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evia.am/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/evia;
    index index.html;

    # The site is static files written by scripts/deploy-site.sh. Nothing here executes anything.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Only sent once HTTPS is known to work. Remove this line while testing, because a browser
    # remembers it and will then refuse plain http for this name.
    add_header Strict-Transport-Security "max-age=15552000" always;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The installers, if they are served from here rather than from GitHub. Large files, so no
    # gzip and a long cache: a release asset never changes once published.
    location /downloads/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        gzip off;
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}

# ---------------------------------------------------------------- GitLab, for this network only
#
# GitLab's own nginx is on 127.0.0.1:8081; this passes LAN requests to it so that
# http://192.168.10.13/ keeps working exactly as before. The allow/deny list is what makes it
# private: a request arriving from the internet is refused here even if it carries the right name.
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.10.13 dell dell.local git.evia.am;

    allow 192.168.10.0/24;     # this network
    allow 100.64.0.0/10;       # the Tailscale range, so it works remotely over the VPN
    allow 127.0.0.1;
    deny all;

    client_max_body_size 256m;   # git pushes over http

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
