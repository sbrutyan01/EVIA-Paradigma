# The first config to install: port 80 only, enough for certbot to prove the domain.
#
# Use this one BEFORE a certificate exists, because evia.am.conf refers to certificate files and
# nginx will not start without them. Once certbot has run, replace it with evia.am.conf.
#
#   sudo cp packaging/nginx/evia.am.bootstrap.conf /etc/nginx/sites-available/evia.am
#   sudo ln -sf /etc/nginx/sites-available/evia.am /etc/nginx/sites-enabled/evia.am
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d evia.am -d www.evia.am
#   sudo cp packaging/nginx/evia.am.conf /etc/nginx/sites-available/evia.am
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Any name, or none, so the bare address serves the site too - useful for checking before DNS
    # has settled. GitLab is kept private by the allow/deny list in its own block, not by this.
    server_name evia.am www.evia.am _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # The site, over plain http, only until the certificate exists. evia.am.conf redirects
    # everything here to https instead.
    root /var/www/evia;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# GitLab for this network, exactly as in evia.am.conf, so moving it off port 80 does not take the
# LAN access away in the meantime.
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.10.13 dell dell.local;

    allow 192.168.10.0/24;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
